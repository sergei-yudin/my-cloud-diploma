services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mycloud}
      POSTGRES_USER: ${POSTGRES_USER:-mycloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mycloud}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mycloud} -d ${POSTGRES_DB:-mycloud}"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - file_storage:/app/media/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  file_storage:

